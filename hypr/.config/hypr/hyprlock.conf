im using HyprNova setup but it overlaps

source = $HOME/.cache/wal/colors-hyprland.conf

background {
    monitor =
    path = $HOME/.current_wallpaper   # only png supported for now
    # color = $color1

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_size = 4
    blur_passes = 3 # 0 disables blurring
    noise = 0.0117
    contrast = 1.3000 # Vibrant!!!
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# Hours
label {
    monitor =
    text = cmd[update:1000] echo -n "<b>$(date +'%H')</b>"
    color = $color6
    font_size = 112
    font_family = Geist Mono
    shadow_passes = 3
    shadow_size = 4

    position = 0, 250
    halign = center
    valign = center
}

# Minutes
label {
    monitor =
    text = cmd[update:1000] echo -n "<b>$(date +'%M')</b>"
    color = $color6
    font_size = 112
    font_family = Geist Mono
    shadow_passes = 3
    shadow_size = 4

    position = 0, 105
    halign = center
    valign = center
}

# Day of the week
label {
    monitor =
    text = cmd[update:60000] echo -n "<b>$(date +'%A')</b>"
    color = $color7
    font_size = 22
    font_family = JetBrainsMono Nerd Font

    position = 0, -35
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo -n "<b>$(date +'%d %b')</b>"
    color = $color7
    font_size = 18
    font_family = JetBrainsMono Nerd Font

    position = 0, -72
    halign = center
    valign = center
}

# Temperature
label {
    monitor =
    text = cmd[update:1800000] echo -n "<b>Feels like <big>$(curl -fsS 'https://wttr.in?format=%t' | tr -d '+')</big></b>"
    color = $color7
    font_size = 18
    font_family = Geist Mono
    text_align = center

    position = 0, 40
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3

    dots_size = 0.26 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.64 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rouding = -1

    rounding = 22
    outer_color = $color0
    inner_color = $color0
    font_color = $color6
    fade_on_empty = true
    placeholder_text = <i>Password...</i> # Text rendered in the input box when it's empty.

    position = 0, 120
    halign = center
    valign = bottom
}
